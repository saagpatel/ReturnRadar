[package]
name = "return-radar"
version = "1.0.0"
description = "Track purchase return windows and rebate deadlines"
authors = ["Saag Patel"]
edition = "2021"

[lib]
name = "return_radar_lib"
# ReturnRadar currently targets macOS desktop only. Mobile library formats add
# hundreds of megabytes of duplicate dev artifacts without a supported caller.
crate-type = ["lib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["rt", "macros"] }
notify-rust = "4"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
keyring = "3"
base64 = "0.22"
regex = "1"
hex = "0.4"
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.2"
objc2-app-kit = { version = "0.3.2", default-features = false, features = ["std", "NSImage"] }
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSArray", "NSData", "NSDictionary", "NSError", "NSObject", "NSString"] }
objc2-vision = { version = "0.3.2", default-features = false, features = ["std", "VNObservation", "VNRecognizeTextRequest", "VNRequest", "VNRequestHandler", "VNTypes"] }
objc2-pdf-kit = { version = "0.3.2", default-features = false, features = ["std", "objc2-app-kit", "PDFDocument", "PDFPage"] }
